# frps.ini
# The credentials below are filled in by frps at start from environment
# variables, which docker compose loads from ./frp/.env (gitignored; copy
# .env.example). Do not put literal secrets in this tracked file.
[common]
bind_port = 7000
# Specify a UDP port for QUIC.
quic_bind_port = 7000
dashboard_port = 7500
dashboard_user = {{ .Envs.FRP_DASHBOARD_USER }}
dashboard_pwd = {{ .Envs.FRP_DASHBOARD_PWD }}
token = {{ .Envs.FRP_TOKEN }}
