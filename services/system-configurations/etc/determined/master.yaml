## Configure the task container defaults. Tasks include trials, commands, tensorboards and more.
## For all task containers, shm_size_bytes and network_mode are configurable. For trials, the
## network interface used by distributed (multi-machine) training is configurable.
task_container_defaults:
  shm_size_bytes: 17179869184
  network_mode: bridge
#  dtrain_network_interface: <network interface name>
  add_capabilities:
    - IPC_LOCK
  environment_variables:
    - NVIDIA_DRIVER_CAPABILITIES=all

## Resource manager configuration. Defaults to using the agent resource manager.
## default_gpu_resource_pool and default_cpu_resource_pool are the older names of
## default_compute_resource_pool and default_aux_resource_pool: the pools of tasks that name no pool.
resource_manager:
  type: agent
  scheduler:
    type: priority
    fitting_policy: best
  default_gpu_resource_pool: 48c96t_512_3090
  default_cpu_resource_pool: 128c256t_1536_4090

## Resource pools: every named pool is a dynamic pool, stored in the master's database
## (services/determined/resource-pools/, `det resource-pool list-dynamic`). Without a resource_pools
## key the master adds the built-in, empty `default` pool; it stays here, so that a rollback to
## 0.40.1 remains a binary swap. NEVER add a pool here: the master refuses to start when a pool here
## has the name of a dynamic pool (unless it is the identical entry of an adopted pool).

## Configure default checkpoint storage configuration.
checkpoint_storage:
  type: shared_fs
  host_path: /shared/determined_shared_fs
  storage_path: determined-checkpoint
  save_experiment_best: 0
  save_trial_best: 1
  save_trial_latest: 1

## Configure the location where the master looks for static files.
# root: /usr/share/determined/master

## Configure the connection to the Postgres database.
db:
  user: postgres
  host: determined-db
  port: 5432
  name: determined
  # password: <set on the master; not in this repo>

observability:
  enable_prometheus: true

## A user friendly name to identify this cluster by.
cluster_name: CVGL

## Retention of task logs.
retention_policy:
  log_retention_days: 0
  schedule: 0 0 * * *

## Initial password of the built-in admin and determined users.
# security:
#   initial_user_password: <set on the master; not in this repo>

## Task resource monitoring in the WebUI (our fork): the Prometheus of the supplementary services VM.
integrations:
  task_resources:
    prometheus_url: http://10.0.1.68:19090
    det_cluster: cvgl

## Configure whether we collect anonymous information about the usage of
## Determined.
# telemetry:
#   enabled: true
