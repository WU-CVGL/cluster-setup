pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  log_format scrape '$remote_addr $request_method $uri $status';
  access_log /dev/stdout scrape;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
  proxy_buffering off;

  server {
    listen 10.0.1.66:19100;
    location = /metrics {
      if ($request_method != GET) { return 405; }
      allow 10.0.1.68;
      deny all;
      proxy_pass http://172.30.233.2:9100/metrics;
    }
    location / { return 404; }
  }
  server {
    listen 10.0.1.66:19080;
    location = /metrics {
      if ($request_method != GET) { return 405; }
      allow 10.0.1.68;
      deny all;
      proxy_pass http://172.30.233.2:9080/metrics;
    }
    location / { return 404; }
  }
  server {
    listen 10.0.1.66:19400;
    location = /metrics {
      if ($request_method != GET) { return 405; }
      allow 10.0.1.68;
      deny all;
      proxy_pass http://172.30.233.2:9400/metrics;
    }
    location / { return 404; }
  }
}
