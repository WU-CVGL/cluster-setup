# The 24-hour probe success rates and coverage of the proxies (services/proxy-portal/portal/queries.py
# STATUS["proxies"], the same as the Proxy Availability dashboard's Proxies table; the portal's tests check that the
# expressions below are those). Probes run every 30 s, so a full day has 2880 samples. A proxy reclassified between
# public and private gets new pool and access labels, so its old and new series share the 24 hours: the rate pools
# their samples per protocol, and the coverage counts them together per protocol and takes the lower protocol.
rule_files: []
evaluation_interval: 30s
tests:
  - name: reclassified 6 hours ago, passing before and failing since
    interval: 30s
    input_series:
      # 18 hours passing on the old labels, then 6 hours failing on the new ones
      - series: 'probe_success{job="proxy-probe",instance="q1_http",entry="q1",protocol="http",kind="raw",pool="ha-general",access="public"}'
        values: '_ 1x2159 stale'
      - series: 'probe_success{job="proxy-probe",instance="q1_socks",entry="q1",protocol="socks",kind="raw",pool="ha-general",access="public"}'
        values: '_ 1x2159 stale'
      - series: 'probe_success{job="proxy-probe",instance="q1_http",entry="q1",protocol="http",kind="raw",pool="ha-private",access="private"}'
        values: '_x2161 0x719'
      - series: 'probe_success{job="proxy-probe",instance="q1_socks",entry="q1",protocol="socks",kind="raw",pool="ha-private",access="private"}'
        values: '_x2161 0x719'
    promql_expr_test:
      - expr: 'sum by (entry) (sum_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h])) / sum by (entry) (count_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h]))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q1"}'
            value: 0.75
      - expr: 'sum by (entry) (sum_over_time(probe_success{job="proxy-probe",kind="raw",protocol="socks"}[24h])) / sum by (entry) (count_over_time(probe_success{job="proxy-probe",kind="raw",protocol="socks"}[24h]))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q1"}'
            value: 0.75
      - expr: 'min by (entry) (clamp_max(sum by (entry, protocol) (count_over_time(probe_success{job="proxy-probe",kind="raw"}[24h])) / 2880, 1))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q1"}'
            value: 1

  - name: two label sets for a whole day, and a partly probed protocol
    interval: 30s
    input_series:
      # HTTP on both label sets for the whole day, one passing and one failing; SOCKS5 for a quarter of the day
      - series: 'probe_success{job="proxy-probe",instance="q2_http",entry="q2",protocol="http",kind="raw",pool="ha-general",access="public"}'
        values: '_ 1x2879'
      - series: 'probe_success{job="proxy-probe",instance="q2_http",entry="q2",protocol="http",kind="raw",pool="ha-private",access="private"}'
        values: '_ 0x2879'
      - series: 'probe_success{job="proxy-probe",instance="q2_socks",entry="q2",protocol="socks",kind="raw",pool="ha-private",access="private"}'
        values: '_x2160 1x719'
    promql_expr_test:
      - expr: 'sum by (entry) (sum_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h])) / sum by (entry) (count_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h]))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q2"}'
            value: 0.5
      - expr: 'sum by (entry) (sum_over_time(probe_success{job="proxy-probe",kind="raw",protocol="socks"}[24h])) / sum by (entry) (count_over_time(probe_success{job="proxy-probe",kind="raw",protocol="socks"}[24h]))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q2"}'
            value: 1
      - expr: 'min by (entry) (clamp_max(sum by (entry, protocol) (count_over_time(probe_success{job="proxy-probe",kind="raw"}[24h])) / 2880, 1))'
        eval_time: 24h
        exp_samples:
          - labels: '{entry="q2"}'
            value: 0.25
      - expr: 'sum by (entry) (sum_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h])) / sum by (entry) (count_over_time(probe_success{job="proxy-probe",kind="raw",protocol="http"}[24h]))'
        eval_time: 48h
        exp_samples: []
      - expr: 'min by (entry) (clamp_max(sum by (entry, protocol) (count_over_time(probe_success{job="proxy-probe",kind="raw"}[24h])) / 2880, 1))'
        eval_time: 48h
        exp_samples: []
