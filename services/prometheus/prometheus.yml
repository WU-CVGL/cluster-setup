global:
  scrape_interval: 5s
  scrape_timeout: 1s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
  - job_name: "node"
    scrape_interval: 15s
    scrape_timeout: 5s
    relabel_configs:
      - target_label: det_cluster
        replacement: cvgl
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: node
        replacement: '$1'
      - source_labels: [node]
        regex: 'cvglloginnode\.lan'
        target_label: node
        replacement: login.cvgl.lab
      - source_labels: [instance]
        regex: 's8030:[0-9]+'
        target_label: node
        replacement: s8030
    static_configs:
      - targets:
          - "cvglcorevm.lan:9100"
          - "cvglsuppvm.lan:9100"
          - "login.cvgl.lab:9100"
          - "cvgl-node01.lan:9100"
          - "cvgl-node02.lan:9100"
          - "cvgl-node03.lan:9100"
          - "cvgl-node04.lan:9100"
          - "cvgl-node05.lan:9100"
          - "cvgl-node06.lan:9100"
          - "cvgl-node07.lan:9100"
          - "cvgl-node08.lan:9100"
      - targets: ["10.0.1.66:19100"]
        labels:
          instance: s8030:9100
  - job_name: "cadvisor"
    relabel_configs:
      - target_label: det_cluster
        replacement: cvgl
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: node
        replacement: '$1'
      - source_labels: [node]
        regex: 'cvglloginnode\.lan'
        target_label: node
        replacement: login.cvgl.lab
      - source_labels: [instance]
        regex: 's8030:[0-9]+'
        target_label: node
        replacement: s8030
    metric_relabel_configs:
      - source_labels: [id]
        regex: '.*/docker/([0-9a-f]{64})'
        target_label: container_runtime_id
        replacement: '$1'
      - source_labels: [id]
        regex: '.*docker-([0-9a-f]{64})\.scope'
        target_label: container_runtime_id
        replacement: '$1'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - "cvgl-node01.lan:9080"
          - "cvgl-node02.lan:9080"
          - "cvgl-node03.lan:9080"
          - "cvgl-node04.lan:9080"
          - "cvgl-node05.lan:9080"
          - "cvgl-node06.lan:9080"
          - "cvgl-node07.lan:9080"
          - "cvgl-node08.lan:9080"
      - targets: ["10.0.1.66:19080"]
        labels:
          instance: s8030:9080
  - job_name: "dcgm"
    relabel_configs:
      - target_label: det_cluster
        replacement: cvgl
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: node
        replacement: '$1'
      - source_labels: [node]
        regex: 'cvglloginnode\.lan'
        target_label: node
        replacement: login.cvgl.lab
      - source_labels: [instance]
        regex: 's8030:[0-9]+'
        target_label: node
        replacement: s8030
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - "cvgl-node01.lan:9400"
          - "cvgl-node02.lan:9400"
          - "cvgl-node03.lan:9400"
          - "cvgl-node04.lan:9400"
          - "cvgl-node05.lan:9400"
          - "cvgl-node06.lan:9400"
          - "cvgl-node07.lan:9400"
          - "cvgl-node08.lan:9400"
      - targets: ["10.0.1.66:19400"]
        labels:
          instance: s8030:9400
    metrics_path: /metrics
    scheme: http
    follow_redirects: true
    metric_relabel_configs:
    - source_labels: [__name__, UUID]
      separator: ;
      regex: DCGM.*;(.*)
      target_label: gpu_uuid
      replacement: $1
      action: replace
  - job_name: "v2ray"
    metrics_path: /scrape
    static_configs:
      - targets:
          - "xray-us-west-racknerd-12tb-exporter:9550"
          - "xray-usca1-bwh-megaboxpro-2tb-exporter:9550"
          - "xray-usca5-bwh-sla-1tb-exporter:9550"
          - "xray-usca6-bwh-1tb-exporter:9550"
          - "xray-jpty1-bwh-2tb-exporter:9550"
          - "xray-miyaip-jp-01_relay_jpty1-bwh-2tb-exporter:9550"
          - "xray-miyaip-jp-01_relay_usca5-bwh-sla-2tb-exporter:9550"
          - "xray-miyaip-uk-01_relay_usca5-bwh-sla-2tb-exporter:9550"
          - "xray-miyaip-uk-01_relay_jpty1-bwh-2tb-exporter:9550"
        # proxy_role keeps the two layers apart: a request through the HA entry is counted
        # once by xray-ha and again by the line it goes through.
        labels:
          proxy_role: raw
      - targets:
          - "xray-ha-exporter:9550"
        labels:
          proxy_role: entry
  # End-to-end probes through each proxy entry (services/blackbox/blackbox.example.yml): a target is a
  # blackbox module, <entry>_<http|socks>; every probe fetches the same URL. 30 s apart, with a
  # 10 s scrape timeout over the module's 8 s, since a request abroad can take seconds.
  # A new xray line needs its two modules there and its two targets here (pool: none).
  - job_name: "proxy-probe"
    metrics_path: /probe
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "ha-general_http"
          - "ha-general_socks"
        labels:
          kind: ha
          pool: ha-general
      - targets:
          - "usca5-bwh-sla-1tb_http"
          - "usca5-bwh-sla-1tb_socks"
          - "usca1-bwh-megaboxpro-2tb_http"
          - "usca1-bwh-megaboxpro-2tb_socks"
          - "usca6-bwh-1tb_http"
          - "usca6-bwh-1tb_socks"
          - "us-west-racknerd-12tb_http"
          - "us-west-racknerd-12tb_socks"
        labels:
          kind: raw
          pool: ha-general
      - targets:
          - "jpty1-bwh-2tb_http"
          - "jpty1-bwh-2tb_socks"
          - "miyaip-uk-01_relay_jpty1-bwh-2tb_http"
          - "miyaip-uk-01_relay_jpty1-bwh-2tb_socks"
          - "miyaip-uk-01_relay_usca5-bwh-sla-2tb_http"
          - "miyaip-uk-01_relay_usca5-bwh-sla-2tb_socks"
          - "miyaip-jp-01_relay_usca5-bwh-sla-2tb_http"
          - "miyaip-jp-01_relay_usca5-bwh-sla-2tb_socks"
          - "miyaip-jp-01_relay_jpty1-bwh-2tb_http"
          - "miyaip-jp-01_relay_jpty1-bwh-2tb_socks"
        labels:
          kind: raw
          pool: none
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_module
      - source_labels: [__address__]
        regex: '(.+)_(http|socks)'
        target_label: entry
        replacement: '$1'
      - source_labels: [__address__]
        regex: '(.+)_(http|socks)'
        target_label: protocol
        replacement: '$2'
      - source_labels: [__address__]
        target_label: instance
      - target_label: __param_target
        replacement: https://www.google.com/generate_204
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: det-master
    relabel_configs:
      - target_label: det_cluster
        replacement: cvgl
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: node
        replacement: '$1'
      - source_labels: [node]
        regex: 'cvglloginnode\.lan'
        target_label: node
        replacement: login.cvgl.lab
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /prom/det-state-metrics
    scheme: http
    follow_redirects: true
    metric_relabel_configs:
    - source_labels: [task_actor]
      separator: ;
      regex: /experiments/(.+)\/.*\/.*
      target_label: experiment_id
      replacement: $1
      action: replace
    static_configs:
    - targets:
      - cvglcorevm.lan:8080
    authorization:
      type: Bearer
      credentials_file: /run/determined-metrics/token
