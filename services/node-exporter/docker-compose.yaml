services:
  node-exporter:
    image: harbor.cvgl.lab/library/prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: harbor.cvgl.lab/library/cadvisor:v0.60.6
    container_name: monitoring_cadvisor
    restart: unless-stopped
    command: 
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/cgroup:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - 9080:8080

  dcgm-exporter:
    image: harbor.cvgl.lab/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4
    restart: unless-stopped
    # DCGM enables profiling metrics on cards that support them (RTX 6000 Ada) and needs
    # SYS_ADMIN to watch them; without it the exporter exits at startup on those nodes.
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./default-counters.csv:/etc/dcgm-exporter/default-counters.csv
    ports:
      - 9400:9400
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
