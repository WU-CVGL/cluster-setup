  grafana:
    image: grafana/grafana:13.0.1-security-01
    restart: unless-stopped
    user: "472:0"
    environment:
      - DS_PROMETHEUS=prometheus
      - TZ=Asia/Shanghai
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      # Slack webhooks of the GPU health alerts (grafana/provisioning/alerting/gpu-health.yaml),
      # from services/.env, for this service only (grafana/.env is shared with grafana-renderer).
      # The default is a dead local address, never empty: an empty Slack URL fails the alerting
      # provisioning and Grafana does not start. Unset, the alerts are evaluated but not delivered.
      # A changed value needs a recreate (`up -d --no-deps grafana`), not a restart. README.md, 7.4.
      - SLACK_GPU_CRITICAL_WEBHOOK_URL=${SLACK_GPU_CRITICAL_WEBHOOK_URL:-http://127.0.0.1:9/slack-gpu-critical-webhook-not-set}
      - SLACK_GPU_APP_WEBHOOK_URL=${SLACK_GPU_APP_WEBHOOK_URL:-http://127.0.0.1:9/slack-gpu-app-webhook-not-set}
    env_file:
      - ./grafana/.env
    volumes:
      - ./grafana/custom.ini:/etc/grafana/grafana.ini
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - grafana_monitor
    ports:
      - "10080:3000"

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped
    networks:
      - grafana_monitor
    expose:
      - 8081
    env_file:
      - ./grafana/.env

  prometheus:
    image: prom/prometheus:v3.11.3
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - grafana_monitor
    environment:
      TZ: Asia/Shanghai
    volumes:
      # TSDB host dir: PROMETHEUS_TSDB_DIR from services/.env. Required on purpose,
      # no default: a missing value must stop compose, never start Prometheus on
      # the old NFS copy (/srv/nfs/var/prometheus, kept only as a rollback copy).
      - "${PROMETHEUS_TSDB_DIR:?set it in services/.env to the local TSDB directory (see services/.env.example), never to the NFS rollback copy}:/prometheus"
      - ./prometheus:/etc/prometheus:ro
      - ${DET_METRICS_SECRETS_DIR:-./prometheus/secrets}:/run/determined-metrics:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  db:
    image: postgres:14-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      - /srv/nfs/var/nextcloud/var/lib/postgresql/data:/var/lib/postgresql/data
    env_file:
      - nextcloud/db.env

  nextcloud-redis:
    image: redis:alpine
    restart: always
    networks:
      - nextcloud

  nextcloud-app:
    image: nextcloud:fpm-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      - /srv/nfs/var/nextcloud/var/www/html:/var/www/html
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=nextcloud-redis
    env_file:
      - ./nextcloud/db.env
      - ./nextcloud/nextcloud.env
    depends_on:
      - db
      - nextcloud-redis

  nextcloud-nginx:
    image: nginx:alpine
    restart: always
    networks:
      - nextcloud
    ports:
      - 8008:80
    volumes:
      - ./nextcloud/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/nfs/var/nextcloud/var/www/html:/var/www/html:ro
    depends_on:
      - nextcloud-app

  nextcloud-cron:
    image: nextcloud:fpm-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      -  /srv/nfs/var/nextcloud/var/www/html:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
      - nextcloud-redis
