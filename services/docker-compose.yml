  # End-to-end probes through the HA entry and every xray line (blackbox/blackbox.example.yml), scraped
  # by the proxy-probe job; the Proxy Availability dashboard shows them.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    networks:
      - grafana_monitor
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    # blackbox/config/blackbox.yml holds the probe account: rendered by xray/scripts/proxy_accounts.py
    # from blackbox/blackbox.example.yml, not in git. The folder is mounted, so a re-rendered file
    # (replaced, not rewritten) is seen after a SIGHUP.
    volumes:
      - ./blackbox/config:/etc/blackbox_exporter:ro
    expose:
      - 9115

  # The HA proxy entries (docs/00_Network_Proxy.md#the-ha-entry): ha-general, HTTP on 30889 and
  # SOCKS5 on 30089, over the public lines; ha-all, for admins, HTTP on 31889 and SOCKS5 on 31089,
  # over every line (docs/00_Network_Proxy.md#admin-entries).
  # Its config is xray-ha/config/config.json, not in git: xray-ha/config.example.json with the proxy
  # accounts, rendered by xray/scripts/proxy_accounts.py. Every port requires an account.
  # Each entry forwards each new connection to one of its lines, the one with the lowest probe
  # latency among those that pass Xray's own probe, and fails closed when none does. It has no
  # route of its own to the internet or to China: each line's xray service decides that.
  # The ports are below the Linux ephemeral range (32768-60999); a new port needs
  # `docker compose up -d xray-ha`, a restart does not publish it.
  xray-ha:
    image: teddysun/xray:26.11.9@sha256:b3e117b834878d1e12f91e7b16270db104c2f0e5f0effbc0ece9088c473b5393
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    ports:
      - 30089:1089     # ha-general SOCKS5
      - 30889:8889     # ha-general HTTP
      - 31089:1090     # ha-all SOCKS5
      - 31889:8890     # ha-all HTTP
    volumes:
      - ./xray-ha/config:/etc/xray:ro
    expose:
      - 10085

  xray-ha-exporter:
    image: wi1dcard/v2ray-exporter:master
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    restart: unless-stopped
    command: 'v2ray-exporter --v2ray-endpoint "xray-ha:10085" --listen ":9550"'
    expose:
      - 9550

  # The proxy portal (proxy-portal/README.md): status, My access, My usage, behind nginx as
  # https://proxy.cvgl.lab. It reads the applier's status.json from the spool (read-only; requests/
  # and results/ masked), queries Prometheus on this network, and checks sign-ins with the
  # Determined master. Its database and secret key are in the data folder, owned by uid 3089.
  # No Docker socket, no accounts file.
  proxy-portal:
    build: ./proxy-portal
    image: proxy-portal
    restart: unless-stopped
    user: "3089:3089"
    environment:
      TZ: Asia/Shanghai
      PROXY_PORTAL_MASTER_URL: ${PROXY_PORTAL_MASTER_URL:-http://192.168.233.6:8080}
    networks:
      - grafana_monitor
    ports:
      # nginx reaches it on the private address; never published on the campus address
      - "192.168.233.8:8095:8000"
    volumes:
      - ${PROXY_PORTAL_SPOOL:-/var/lib/proxy-portal/spool}:/srv/spool:ro
      - ${PROXY_PORTAL_DATA:-/var/lib/proxy-portal/data}:/data
    tmpfs:
      - /srv/spool/requests:size=64k,mode=0700,uid=3089,gid=3089
      - /srv/spool/results:size=64k,mode=0700,uid=3089,gid=3089
      - /tmp:size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'Host': 'proxy.cvgl.lab', 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:13.0.1-security-01
    restart: unless-stopped
    user: "472:0"
    environment:
      - DS_PROMETHEUS=prometheus
      - TZ=Asia/Shanghai
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      # Slack webhooks of the GPU health alerts (grafana/provisioning/alerting/gpu-health.yaml),
      # from services/.env, for this service only (grafana/.env is shared with grafana-renderer).
      # The default is a dead local address, never empty: an empty Slack URL fails the alerting
      # provisioning and Grafana does not start. Unset, the alerts are evaluated but not delivered.
      # A changed value needs a recreate (`up -d --no-deps grafana`), not a restart. README.md, 7.4.
      - SLACK_GPU_CRITICAL_WEBHOOK_URL=${SLACK_GPU_CRITICAL_WEBHOOK_URL:-http://127.0.0.1:9/slack-gpu-critical-webhook-not-set}
      - SLACK_GPU_APP_WEBHOOK_URL=${SLACK_GPU_APP_WEBHOOK_URL:-http://127.0.0.1:9/slack-gpu-app-webhook-not-set}
    env_file:
      - ./grafana/.env
    volumes:
      - ./grafana/custom.ini:/etc/grafana/grafana.ini
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - grafana_monitor
    ports:
      - "10080:3000"

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped
    networks:
      - grafana_monitor
    expose:
      - 8081
    env_file:
      - ./grafana/.env

  prometheus:
    image: prom/prometheus:v3.11.3
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - grafana_monitor
    environment:
      TZ: Asia/Shanghai
    volumes:
      # TSDB host dir: PROMETHEUS_TSDB_DIR from services/.env. Required on purpose,
      # no default: a missing value must stop compose, never start Prometheus on
      # the old NFS copy (/srv/nfs/var/prometheus, kept only as a rollback copy).
      - "${PROMETHEUS_TSDB_DIR:?set it in services/.env to the local TSDB directory (see services/.env.example), never to the NFS rollback copy}:/prometheus"
      - ./prometheus:/etc/prometheus:ro
      - ${DET_METRICS_SECRETS_DIR:-./prometheus/secrets}:/run/determined-metrics:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-admin-api'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  db:
    image: postgres:14-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      - /srv/nfs/var/nextcloud/var/lib/postgresql/data:/var/lib/postgresql/data
    env_file:
      - nextcloud/db.env

  nextcloud-redis:
    image: redis:alpine
    restart: always
    networks:
      - nextcloud

  nextcloud-app:
    image: nextcloud:fpm-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      - /srv/nfs/var/nextcloud/var/www/html:/var/www/html
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=nextcloud-redis
    env_file:
      - ./nextcloud/db.env
      - ./nextcloud/nextcloud.env
    depends_on:
      - db
      - nextcloud-redis

  nextcloud-nginx:
    image: nginx:1.30.6-alpine
    restart: always
    networks:
      - nextcloud
    ports:
      - 8008:80
    volumes:
      - ./nextcloud/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/nfs/var/nextcloud/var/www/html:/var/www/html:ro
    depends_on:
      - nextcloud-app

  nextcloud-cron:
    image: nextcloud:fpm-alpine
    restart: always
    networks:
      - nextcloud
    volumes:
      -  /srv/nfs/var/nextcloud/var/www/html:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
      - nextcloud-redis
