networks:
  grafana_monitor:
    driver: bridge
  nextcloud:
    external: false

volumes:
  portainer_data:
    driver: local

services:
  hbbs:
    container_name: hbbs
    image: harbor.cvgl.lab/library/rustdesk/rustdesk-server
    command: hbbs
    volumes:
      - ./rustdesk/data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: harbor.cvgl.lab/library/rustdesk/rustdesk-server
    command: hbbr
    volumes:
      - ./rustdesk/data:/root
    network_mode: "host"
    restart: unless-stopped

  wandb:
    image: wandb/local
    restart: always
    ports:
      - 8081:8080
    volumes:
      - /srv/nfs/var/wandb/vol:/vol
    environment:
      - WANDB_BASE_URL="http://localhost:8080"
    env_file:
      - ./wandb/.env

  portainer:
    image: portainer/portainer-ce:alpine
    restart: always
    ports:
      - 9000:9000
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  watchdog:
    build: ./determined-watchdog/build
    image: determined-watchdog
    restart: always
    volumes:
      - ./determined-watchdog/data:/app/data
      # Directory mount lets atomic token rotation become visible to Prometheus.
      # Host dir: DET_METRICS_SECRETS_DIR from services/.env (default ./prometheus/secrets).
      - ${DET_METRICS_SECRETS_DIR:-./prometheus/secrets}:/run/determined-metrics
    networks:
      - grafana_monitor
    env_file:
      - ./determined-watchdog/.env

  frp:
    image: snowdreamtech/frps:0.51.3
    network_mode: "host"
    restart: always
    volumes:
      - ./frp/frps.ini:/etc/frp/frps.ini
    env_file:
      - ./frp/.env

  nginx:
    build: ./nginx/build
    image: reverseproxy
    ports:
        - "80:80"
        - "443:443"
        - "33322:22"
        - "8080:8080"
    restart: always
    volumes:
      - ./nginx/data/html:/usr/share/nginx/html:ro
      - /etc/ssl/private:/opt/ssl:ro

  flare:
    image: soulteary/flare
    restart: always
    command: flare
    ports:
      - "5005:5005"
    volumes:
      - ./flare/app:/app

  xray-jp-osaka-bwh:
    image: teddysun/xray:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    ports:
      - 30089:1089
      - 38889:8889
    volumes: 
      - ./xray/jp-osaka-bwh/config:/etc/xray
      - ./xray/jp-osaka-bwh/log:/var/log/xray
    expose:
      - 10085

  xray-us-west-racknerd-12tb:
    image: teddysun/xray:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    ports:
      - 50089:1089
      - 58889:8889
    volumes: 
      - ./xray/us-west-racknerd-12tb/config:/etc/xray
      - ./xray/us-west-racknerd-12tb/log:/var/log/xray
    expose:
      - 10085

  xray-jp-osaka-bwh-exporter:
    image: wi1dcard/v2ray-exporter:master
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    restart: unless-stopped
    command: 'v2ray-exporter --v2ray-endpoint "xray-jp-osaka-bwh:10085" --listen ":9550"'
    expose:
