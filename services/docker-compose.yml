networks:
  grafana_monitor:
    driver: bridge
  nextcloud:
    external: false

volumes:
  portainer_data:
    driver: local

services:
  hbbs:
    container_name: hbbs
    image: harbor.cvgl.lab/library/rustdesk/rustdesk-server
    command: hbbs
    volumes:
      - ./rustdesk/data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: harbor.cvgl.lab/library/rustdesk/rustdesk-server
    command: hbbr
    volumes:
      - ./rustdesk/data:/root
    network_mode: "host"
    restart: unless-stopped

  wandb:
    image: wandb/local
    restart: always
    ports:
      - 8081:8080
    volumes:
      - /srv/nfs/var/wandb/vol:/vol
    environment:
      - WANDB_BASE_URL="http://localhost:8080"
    env_file:
      - ./wandb/.env

  portainer:
    image: portainer/portainer-ce:alpine
    restart: always
    ports:
      - 9000:9000
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  watchdog:
    build: ./determined-watchdog/build
    image: determined-watchdog
    restart: always
    volumes:
      - ./determined-watchdog/data:/app/data
      # Directory mount lets atomic token rotation become visible to Prometheus.
      # Host dir: DET_METRICS_SECRETS_DIR from services/.env (default ./prometheus/secrets).
      - ${DET_METRICS_SECRETS_DIR:-./prometheus/secrets}:/run/determined-metrics
    networks:
      - grafana_monitor
    env_file:
      - ./determined-watchdog/.env

  frp:
    image: snowdreamtech/frps:0.51.3
    network_mode: "host"
    restart: always
    volumes:
      - ./frp/frps.ini:/etc/frp/frps.ini
    env_file:
      - ./frp/.env

  nginx:
    build: ./nginx/build
    image: reverseproxy
    ports:
        - "80:80"
        - "443:443"
        - "33322:22"
        - "8080:8080"
    restart: always
    volumes:
      - ./nginx/data/html:/usr/share/nginx/html:ro
      - /etc/ssl/private:/opt/ssl:ro

  flare:
    image: soulteary/flare
    restart: always
    command: flare
    ports:
      - "5005:5005"
    volumes:
      - ./flare/app:/app

  # PyPI cache for the nodes and the Determined tasks (services/proxpi/README.md).
  # BFSU and pypi.org are reached directly, so the service gets no proxy variables.
  # pypi.org is only the fallback for files BFSU lacks: an error from an extra index fails the
  # whole project listing (HTTP 500), hence the connect and read timeouts.
  # One process only: the cache is not shared between workers, so raise --threads, not workers.
  proxpi:
    image: epicwink/proxpi:1.3.1
    restart: unless-stopped
    command: ["--bind", "0.0.0.0:5000", "--threads", "16", "--no-control-socket"]
    environment:
      - PROXPI_INDEX_URL=https://mirrors.bfsu.edu.cn/pypi/web/simple/
      - PROXPI_EXTRA_INDEX_URLS=https://pypi.org/simple/
      # One TTL (seconds) per extra index URL.
      - PROXPI_EXTRA_INDEX_TTLS=1800
      - PROXPI_CONNECT_TIMEOUT=3.1
      - PROXPI_READ_TIMEOUT=20
      - PROXPI_CACHE_DIR=/var/cache/proxpi
      # Bytes, an integer only (50 GiB): least-used files are evicted beyond it.
      - PROXPI_CACHE_SIZE=53687091200
    ports:
      - "5000:5000"
    volumes:
      - ./proxpi/data:/var/cache/proxpi
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health"]
      interval: 1m
      timeout: 10s
      retries: 3

  xray-us-west-racknerd-12tb:
    image: teddysun/xray:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    ports:
      - 50089:1089
      - 58889:8889
    volumes: 
      - ./xray/us-west-racknerd-12tb/config:/etc/xray
      - ./xray/us-west-racknerd-12tb/log:/var/log/xray
    expose:
      - 10085

  xray-us-west-racknerd-12tb-exporter:
    image: wi1dcard/v2ray-exporter:master
    environment:
      TZ: Asia/Shanghai
    networks:
      - grafana_monitor
    restart: unless-stopped
