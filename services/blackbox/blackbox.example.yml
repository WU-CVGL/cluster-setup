# End-to-end checks through each proxy entry, scraped by the proxy-probe job of
# services/prometheus/prometheus.yml (docs/00_Network_Proxy.md#proxy-availability).
# One module per entry and protocol, named <entry>_<http|socks>; the job passes the probe URL.
# A line's entry is the xray-<line> service itself, never the HA entry, so a line that fails
# shows as failed even while the HA entry carries on through another line.
# blackbox_exporter reads blackbox/config/blackbox.yml, which xray/scripts/proxy_accounts.py renders
# from this file: it puts the svc-monitor account into every proxy_url through xray-ha (ha-general on
# 8889/1089, ha-all on 8890/1090) and the private lines, and into the public lines' ones when they
# require accounts (raw auth). svc-monitor:PASSWORD below is a placeholder.
modules:
  ha-general_http:
    prober: http
    timeout: 8s
    http:
      proxy_url: http://svc-monitor:PASSWORD@xray-ha:8889
      skip_resolve_phase_with_proxy: true
      follow_redirects: false
      valid_status_codes:
      - 204
      preferred_ip_protocol: ip4
  ha-general_socks:
    prober: http
    timeout: 8s
    http:
      proxy_url: socks5://svc-monitor:PASSWORD@xray-ha:1089
      skip_resolve_phase_with_proxy: true
      follow_redirects: false
      valid_status_codes:
      - 204
      preferred_ip_protocol: ip4
  ha-all_http:
    prober: http
    timeout: 8s
    http:
      proxy_url: http://svc-monitor:PASSWORD@xray-ha:8890
      skip_resolve_phase_with_proxy: true
